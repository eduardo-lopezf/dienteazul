services:
  db:
    # The official image without `gosu`, not root: postgres/Dockerfile.
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dental_clinic}
      POSTGRES_USER: ${POSTGRES_USER:-dental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dental} -d ${POSTGRES_DB:-dental_clinic}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_FQDN_BACKEND_8000: ${BACKEND_FQDN}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dental}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_clinic}
      SECRET_KEY: ${SECRET_KEY}
      # Signs the public-budget links (ADR 0006). Mandatory in production
      # and different from SECRET_KEY, or the backend refuses to start:
      # openssl rand -hex 32.
      BUDGET_PUBLIC_SECRET_KEY: ${BUDGET_PUBLIC_SECRET_KEY}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${FRONTEND_URL}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
      # Demo deployments set SEED_ON_STARTUP=1 in Coolify env so a wiped
      # DB volume self-heals on next restart: alembic recreates the
      # schema and seed_demo.py repopulates it (idempotent — no-op when
      # the demo clinic already exists). Real production deployments
      # leave it unset so seed never runs.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-0}
      SEED_LANG: ${SEED_LANG:-es}
      # The secret the control panel shares with this backend to reach
      # /api/v1/ops (ADR 0049 rule 4): its Logs, usage and clinics. Unset,
      # that endpoint does not exist. Set it in Coolify's Environment tab
      # (at least 32 characters) and the same value in the panel's
      # Ambientes page.
      CONTROL_PLANE_SECRET: ${CONTROL_PLANE_SECRET:-}
      # Logging (see .env.example). The application log is also written to
      # <LOG_DIR>/dienteazul.log so the control panel's Logs → Aplicación
      # can read it (GET /api/v1/ops/logs); the server errors go to the
      # same directory (ERROR_LOG_DIR's default, ADR 0060).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/var/log/dienteazul}
    volumes:
      - storage_data:/app/storage
      # Both logs outlive a redeploy: without a volume each new container
      # starts with the panel's Logs empty. The image gives the directory
      # to the app's user, and a new named volume takes that ownership.
      - error_logs:/var/log/dienteazul
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    environment:
      SERVICE_FQDN_FRONTEND_3000: ${FRONTEND_FQDN}
      NUXT_API_BASE_URL_SERVER: http://backend:8000
      NUXT_PUBLIC_APP_ORIGIN: ${FRONTEND_URL}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  storage_data:
  error_logs:
