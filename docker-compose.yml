services:
  db:
    # The official image without `gosu`, started as `postgres` instead of
    # root — see postgres/Dockerfile, which also holds the upstream pin.
    # The tag carries the PostgreSQL version on purpose: the floating
    # `15-alpine` was pulled once and then sat three months behind, on
    # 15.18 with 36 server CVEs fixed in 15.19. A version bump changes this
    # tag, and a tag Compose does not have is one it has to build.
    build: ./postgres
    image: dienteazul-postgres:15.19-1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dental_clinic}
      POSTGRES_USER: ${POSTGRES_USER:-dental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only. Published on every interface, the database answered
      # to the whole network the machine sits on, and what is left open in
      # the image (libxml2, see scripts/image_audit_gate.py) is reached
      # with nothing more than a connection and a role.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dental} -d ${POSTGRES_DB:-dental_clinic}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      # Test toolchain included; deploys build the default `prod` stage.
      target: dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dental}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_clinic}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/storage}
      # Copilot agentic layer (app/core/llm/). Set OPENAI_API_KEY in .env
      # (gitignored). Empty default keeps the stack bootable without it.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Lets the control plane (control/) read usage per clinic. Empty
      # keeps /api/v1/ops switched off.
      CONTROL_PLANE_SECRET: ${CONTROL_PLANE_SECRET:-}
      # Logging (see .env.example). In development the application log
      # also goes to a file on the `error_logs` volume, so the control
      # panel's Logs can read it (GET /api/v1/ops/logs). Set LOG_DIR to
      # an empty value in .env to keep stdout only.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR-/var/log/dienteazul}
    ports:
      # Loopback only, like the database. These are development servers:
      # uvicorn with --reload and Nuxt's dev server, which says so itself
      # at startup — "reachable from the network without authentication:
      # anyone who can connect can read the app, build errors and source
      # code". To open the app from another device on the network, drop
      # the address from this line and the frontend's.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
      # The server-error log the control panel reads (ADR 0060). A named
      # volume so the occurrences outlive the container — without it a
      # restart is also the panel forgetting every failure.
      - error_logs:/var/log/dienteazul
      # Mount the frontend root read-write so the backend can regenerate
      # modules.json when a module with a Nuxt layer is installed.
      - ./frontend:/host_frontend
    # `apps.json` is read once at boot (ADR 0038): watch it too, so switching
    # an App in development takes effect without a manual restart.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-include apps.json --proxy-headers --forwarded-allow-ips=*

  frontend:
    build:
      context: ./frontend
      target: builder
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_API_BASE_URL_SERVER: http://backend:8000
      NODE_OPTIONS: --max-old-space-size=4096
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      # Mount backend module packages read-only so Nuxt can `extends`
      # each module's layer (declared via `manifest.frontend.layer_path`).
      # The backend writes absolute paths under this mount into
      # `frontend/modules.json`.
      - ./backend/app/modules:/module_layers:ro
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    command: npm run dev

volumes:
  pgdata:
  storage_data:
  error_logs:
