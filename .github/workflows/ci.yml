name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check backend/

      - name: Run ruff format check
        run: ruff format --check backend/

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.19-alpine3.24@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        env:
          POSTGRES_DB: dental_clinic_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_test
      # 32 bytes or more: PyJWT warns on a shorter HMAC key.
      SECRET_KEY: test-secret-key-for-ci-not-a-real-secret
      ENVIRONMENT: test
      TESTING: "true"
      # Defaults to /app/storage — a path that only exists inside the
      # Docker image's mounted volume (see docker-compose.yml). This
      # runner executes pytest directly on the host, where /app is not
      # writable (root-owned or absent), so anything that touches
      # BACKUP_ROOT (module-uninstall's pre-drop table dump) fails with
      # a read-only-filesystem error — surfaced as tables that "survive"
      # an uninstall because _remove() aborts before dropping them.
      STORAGE_LOCAL_PATH: /tmp/dienteazul-storage

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"


      - name: Run tests (default set)
        working-directory: backend
        run: |
          # The default set collects `tests/test_module_docs.py`, which
          # requires each module's CLAUDE.md and CHANGELOG.md — not synced
          # to GitHub any more (see `.gitignore`). The file stays in the
          # tree and runs on a developer's checkout; only CI skips it.
          python -m pytest -v --tb=short --ignore=tests/test_module_docs.py

      - name: Alembic round-trip (base → head → base → head)
        working-directory: backend
        run: |
          python -m pytest -v -m alembic_roundtrip --tb=short

  manifest-consistency:
    # Static manifest sanity — every entry point in pyproject.toml must
    # resolve, declare a valid manifest, and its role permissions must
    # match the ROLE_PERMISSIONS table. The checks themselves touch no
    # data, but conftest.py's pytest_sessionstart unconditionally
    # provisions/resets a *_test database before any test runs (so a
    # lone `pytest` never lands on the dev DB) — this job still needs a
    # real Postgres to connect to for that, same as backend-test.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.19-alpine3.24@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        env:
          POSTGRES_DB: stub
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Validate manifests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: |
          # `tests/test_module_docs.py` reads every module's CLAUDE.md and
          # CHANGELOG.md, and those are no longer synced to GitHub (see
          # `.gitignore`), so a fresh checkout has none of them. Left here
          # commented — one line to put back — and it still runs locally,
          # where the files are:
          #                  tests/test_module_docs.py \
          python -m pytest tests/test_module_manifest.py \
                           tests/test_module_manifests_consistency.py \
                           tests/test_manifest_validator.py \
                           tests/test_module_loader.py \
                           -v --tb=short

  # ----------------------------------------------------------------
  # Documentation jobs, switched off with the documentation itself.
  #
  # `docs/` is no longer synced to GitHub (see `.gitignore`), so a
