  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  frontend-typecheck:
    # Typechecks the host **and every module layer**.
    #
    # This job used to stub an empty `modules.json` and then only run
    # `nuxi prepare` — so no layer was ever typechecked, and no typecheck
    # ever ran. 194 type errors accumulated behind a green build. The gate
    # now generates a manifest with repo-relative layer paths and fails on
    # any error the baseline does not already know about (ADR 0021).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck host + module layers (no new errors)
        working-directory: frontend
        run: node scripts/typecheck-gate.mjs

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm run test

  e2e:
    # Browser E2E smoke. Boots db + backend via docker compose, runs
    # Nuxt on the host (simpler than juggling the container's bind
    # mount + host npm), drives it with Playwright on the host. Slow
    # (~6 min). Required on main + PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: testpass
      SECRET_KEY: ci-secret-key-for-e2e-not-a-real-secret

    steps:
      - uses: actions/checkout@v5

      - name: Write .env
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SECRET_KEY=${SECRET_KEY}
          ENVIRONMENT=development
          EOF

      - name: Boot db + backend
        run: docker compose up -d db backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend ready"; break
            fi
            sleep 2
          done

      - name: Run migrations
        run: docker compose exec -T backend alembic upgrade heads

      - name: Seed demo data
        run: ./scripts/seed-demo.sh --lang es

      - name: Enable periodontogram and consents modules for e2e coverage
        # periodontogram ships installable=True, auto_install=False, so it
        # starts disabled (ADR 0035) — periodontogram.spec.ts assumes it
        # is running but nothing enabled it here, so the suite silently
        # ran against a module that was off. Enable now (admin exists once
        # seed-demo has run) and restart so PendingProcessor actually
        # mounts its router — enable only flips a pending-state DB row; it
        # needs the next boot to take effect.
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/v1/auth/login \
            -d "username=admin@demo.clinic&password=demo1234" \
            -H "content-type: application/x-www-form-urlencoded" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          curl -sf -X POST http://localhost:8000/api/v1/modules/periodontogram/enable \
            -H "Authorization: Bearer $TOKEN"
          # Same for `consents` (Clinical record App): off by default, and
          # consents.spec.ts needs it running.
          curl -sf -X POST http://localhost:8000/api/v1/modules/consents/enable \
            -H "Authorization: Bearer $TOKEN"
          # And `record`, for record.spec.ts (the Expediente tab).
          curl -sf -X POST http://localhost:8000/api/v1/modules/record/enable \
            -H "Authorization: Bearer $TOKEN"
          docker compose restart backend
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "backend ready"; break
            fi
            sleep 2
          done

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install frontend deps + Playwright browsers
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Generate modules.json with host paths
        # The backend writes `modules.json` with `/module_layers/...`
        # paths that only resolve inside the frontend container. For
        # the host-run Nuxt dev server we regenerate it with absolute
        # host paths pointing at `backend/app/modules/<name>/frontend`.
        working-directory: frontend
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          modules_dir = root / "backend/app/modules"
          entries = []
          for m in sorted(modules_dir.iterdir()):
              layer = m / "frontend"
              if layer.is_dir():
                  entries.append({"name": m.name, "path": str(layer.resolve())})
          Path("modules.json").write_text(
              json.dumps(
                  {"layers": [e["path"] for e in entries], "modules": entries, "version": 1},
                  indent=2,
              )
          )
          PY
          cat modules.json

      - name: Start Nuxt dev in background
        working-directory: frontend
        env:
          NUXT_API_BASE_URL_SERVER: http://localhost:8000
          NUXT_PUBLIC_APP_ORIGIN: http://localhost:3000
          NITRO_HOST: 0.0.0.0
          NITRO_PORT: "3000"
        run: |
          nohup npm run dev > /tmp/nuxt.log 2>&1 &
          echo "nuxt started (pid $!)"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 120); do
            if [ "$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/login)" = "200" ]; then
              echo "frontend ready"; break
            fi
            sleep 2
          done
          curl -sf -o /dev/null -w "final status: %{http_code}\n" http://localhost:3000/login

      - name: Run E2E
        working-directory: frontend
        run: npx playwright test --reporter=list

      - name: Upload Nuxt log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nuxt-dev-log
          path: /tmp/nuxt.log
          retention-days: 7

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
          