# Dependency advisories — ADR 0029.
#
# Separate from ci.yml on purpose. A vulnerability is published on the
# world's schedule, not on ours, so this needs a weekly trigger that the
# main pipeline should not inherit: adding `schedule:` to ci.yml would
# run the two-hour test suite every Monday to answer a question about
# npm metadata.
#
# It has teeth, and the teeth are calibrated. Failing on every advisory
# at any severity is how a job like this gets disabled within a month —
# the floor is what we would actually stop a release for, and everything
# below it is printed rather than enforced.
name: Security audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Mondays 06:00 UTC. Catches an advisory published against code
    # nobody has touched, which is the case push/PR triggers miss.
    - cron: "0 6 * * 1"

jobs:
  python-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project + pip-audit
        working-directory: backend
        run: |
          pip install --upgrade pip setuptools
          pip install -e .
          pip install pip-audit

      # No `--ignore-vuln` entries. There were two, both for python-jose
      # (its algorithm confusion, and `ecdsa` underneath it), neither with
      # a fixed release to move to; the fix was to stop depending on it.
      # An entry added here is a promise, like the allowlists in
      # tests/test_no_dynamic_sql.py: it needs a reason that survives
      # review and goes the moment a fix ships.
      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit --progress-spinner off

  npm-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # npm 10 and 11 disagree about the lock file: npm 11 omits *optional
      # peer* dependencies from it, npm 10 expects them recorded.
      # `package-lock.json` is generated by npm 11 (the version developers
      # run), so npm 10 rejects it with
      # "Missing: cac@6.7.14 / commander@15.0.0 from lock file" — the
      # optional peers of `@bomb.sh/tab`, itself a peer of `@nuxt/cli`.
      # Node 24 ships npm 11, so the pin below is a no-op today; it dates
      # from Node 22 (npm 10) and stays so the npm that reads the lock
      # does not depend on which one the Node release bundles.
      #
      # Pinning npm here rather than adding those entries to the lock: a
      # lock repaired with npm 10 is silently reverted by the next
      # `npm install` on a developer's npm 11, so the fix would not hold.
      #
      # Every job installs with `npm ci` since 2026-10-25. The others get
      # their npm from `node-version: "24"`, which bundles npm 11; this
      # one keeps the explicit pin because it is the job whose whole
      # purpose is to read the lock file as shipped.
      - name: Pin npm to the version that generates the lock file
        run: npm i -g npm@11

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Printed, never fails: the full picture including low/moderate,
      # so the job is readable when it goes red for one high advisory.
      - name: Report all advisories
        working-directory: frontend
        continue-on-error: true
        run: npm audit

      # The gate. `high` is the floor because it is the severity we would
      # hold a release for; low and moderate are visible above and get
      # handled on their own schedule.
      #
      # Through a script rather than `npm audit --audit-level=high`,
      # because npm offers no per-advisory exception and there is one
      # advisory whose fix is genuinely out of reach today. The choice
      # `npm audit` leaves is a gate that is red forever or one raised
      # past the severity we care about, and both end with nobody reading
      # it. The exceptions and their reasons live in the script, and a
      # stale one fails as loudly as a new advisory.
      - name: Fail on unlisted high or critical advisories
        working-directory: frontend
        run: node scripts/audit-gate.mjs

  image-advisories:
    # ADR 0050. The images we build are ours, so their advisories are too. Scout
    # answers only to a logged-in Docker Hub account, and a pull request
    # from a fork gets no secrets — skipped there, which shows as skipped
    # rather than as a scan that passed.
    #
    # DISABLED on 2026-10-06, at the maintainer's request, while other work
    # lands. Nothing about ADR 0050 changed: the images still ship, and
    # while this is off nobody is looking at their CVEs or noticing that a
    # pinned base has fallen behind what upstream publishes. To put it
    # back, delete the `if: false` line and restore the one below it.
    if: false
    # if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      # One image going red says nothing about the others.
      fail-fast: false
      matrix:
        include:
          # `image` picks the exception list in scripts/image_audit_gate.py.
          # `file` is the Dockerfile, built from `context`, and also where
          # the pinned base digest is read from. `floating` is the upstream
          # tag that digest was taken from; it names a major line, so it
          # changes only when the Dockerfile moves to another one.
          - image: postgres
            file: postgres/Dockerfile
            context: postgres
            floating: postgres:15-alpine
          - image: backend
            file: backend/Dockerfile
            context: backend
            floating: python:3.11-slim
          # The production frontend, as a deploy builds it: from the
          # repository root, because the build reads the module layers.
          - image: frontend
            file: frontend/Dockerfile.prod
            context: .
            floating: node:24-alpine
          # The documentation portal: static files behind nginx. Its
          # builder stage is not pinned and not shipped; the digest read
          # from the file is the runtime's.
          - image: docs-portal
            file: docs/portal/Dockerfile
            context: .
            floating: nginx:alpine-slim
    steps:
      - uses: actions/checkout@v5

      # Without this the login step fails with a message about a missing
      # username, which reads like a typo in this file. Say what is
      # actually missing and where it goes.
      - name: Docker Hub credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Docker Scout needs a Docker Hub login. Add the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a read-only access token is enough). Nothing was scanned."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No --target: the last stage, which is what a deploy ships.
      - name: Build the image
        run: docker build -t audit-${{ matrix.image }} -f ${{ matrix.file }} ${{ matrix.context }}

      - name: Scan it
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://audit-${{ matrix.image }}
          sarif-file: ${{ matrix.image }}-image.sarif
          # The gate below decides; a comment on every pull request is
          # one more thing nobody reads.
          write-comment: false

      # Same floor and same shape as the npm gate above: `high` is what
      # we would hold a release for, the exceptions and their reasons
      # live in the script, and one whose fix has become reachable — or
      # that is no longer reported — fails as loudly as a new finding.
      - name: Fail on unlisted high or critical findings
        run: python3 scripts/image_audit_gate.py ${{ matrix.image }} ${{ matrix.image }}-image.sarif

      # What the scan cannot see. PostgreSQL and CPython are compiled
      # from source in their images, so Scout lists none of their own
      # CVEs: the database sat on 15.18 for three months with 36 of them
      # fixed in 15.19 and a scan that never mentioned one. The floating
      # tag is the only signal — when it stops pointing at the digest
      # pinned in the Dockerfile, upstream has published a newer release
      # or rebuilt on newer system packages, and the pin is behind.
      - name: The pinned base is what upstream publishes today
        if: ${{ !cancelled() }}
        env:
          PIN_FILE: ${{ matrix.file }}
          FLOATING: ${{ matrix.floating }}
        run: |
          pinned=$(grep -oE 'sha256:[0-9a-f]{64}' "$PIN_FILE" | head -1)
          published=$(docker buildx imagetools inspect "$FLOATING" --format '{{.Manifest.Digest}}')
          echo "pinned in $PIN_FILE: $pinned"
          echo "published as $FLOATING: $published"
          case "$pinned" in sha256:*) ;; *) echo "::error::could not read a pinned digest from $PIN_FILE"; exit 1 ;; esac
          case "$published" in sha256:*) ;; *) echo "::error::could not read the published digest of $FLOATING; nothing was compared"; exit 1 ;; esac
          if [ "$pinned" != "$published" ]; then
            echo "::error::$FLOATING has moved past the digest pinned in $PIN_FILE. Move the pin (the header of that file says what goes with it)."
            exit 1
          fi
